server:
  port: 8080
  servlet:
    context-path: /

spring:
  config:
    import: "optional:file:../../infra/docker/.env[.properties]"
  application:
    name: api-gateway
  devtools:
    livereload:
      enabled: false
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
  cloud:
    gateway:
      # Add Resilience4j configuration
      resilience4j:
        config:
          default:
            # After 50% of requests fail, the circuit opens
            sliding-window-type: COUNT_BASED
            sliding-window-size: 20 # Last 20 requests
            failure-rate-threshold: 50
            # Wait 10s in open state before transitioning to half-open
            wait-duration-in-open-state: 10s
            # Number of permitted calls in half-open state
            permitted-number-of-calls-in-half-open-state: 5

      default-filters:
        - name: RequestRateLimiter
          args:
            key-resolver: '#{@userOrIpKeyResolver}'
            redis-rate-limiter.replenishRate: 10
            redis-rate-limiter.burstCapacity: 20
            redis-rate-limiter.requestedTokens: 1
        - name: CircuitBreaker
          args:
            name: trippy-backend-cb
            fallbackUri: forward:/fallback/default

      routes:
        # User Service Routes
        - id: auth-route
          uri: http://localhost:8081
          predicates:
            - Path=/auth/**
          filters:
            - name: CircuitBreaker
              args:
                name: userServiceCircuitBreaker
                fallbackUri: forward:/fallback/user-service

        - id: users-route
          uri: http://localhost:8081
          predicates:
            - Path=/users/**
          filters:
            - name: CircuitBreaker
              args:
                name: userServiceCircuitBreaker
                fallbackUri: forward:/fallback/user-service

        - id: wellknown-route
          uri: http://localhost:8081
          predicates:
            - Path=/.well-known/**

        # Chat Service Routes (REST) - /trips/{tripId}/chat/**

        # Must be before trips-route so the more specific path matches first
        - id: trips-chat-route
          uri: http://localhost:8083
          predicates:
            - Path=/trips/{tripId}/chat/**
          filters:
            - name: CircuitBreaker
              args:
                name: chatServiceCircuitBreaker
                fallbackUri: forward:/fallback/chat-service

        # Trip Service Routes
        # Public discover route must be before the general authenticated route
        - id: trips-discover-route
          uri: http://localhost:8082
          predicates:
            - Path=/trips/discover
            - Method=GET
          filters:
            - name: CircuitBreaker
              args:
                name: tripServiceCircuitBreaker
                fallbackUri: forward:/fallback/trip-service

        - id: trips-route
          uri: http://localhost:8082
          predicates:
            - Path=/trips/**
          filters:
            - name: CircuitBreaker
              args:
                name: tripServiceCircuitBreaker
                fallbackUri: forward:/fallback/trip-service

        # Chat Service Routes (REST) - /chats/**
        - id: chats-route
          uri: http://localhost:8083
          predicates:
            - Path=/chats/**
          filters:
            - name: CircuitBreaker
              args:
                name: chatServiceCircuitBreaker
                fallbackUri: forward:/fallback/chat-service

        # Chat Moderation (ADMIN-only) - /admin/chat/**
        # Ban/mute users, soft-delete messages. Role enforcement happens in chat-service.
        - id: admin-chat-route
          uri: http://localhost:8083
          predicates:
            - Path=/admin/chat/**
          filters:
            - name: CircuitBreaker
              args:
                name: chatServiceCircuitBreaker
                fallbackUri: forward:/fallback/chat-service

        # WebSocket Route
        - id: websocket-route
          uri: http://localhost:8083
          predicates:
            - Path=/ws/**

        # AI Service Routes
        - id: ai-route
          uri: http://localhost:8084
          predicates:
            - Path=/ai/**
          filters:
            - name: CircuitBreaker
              args:
                name: aiServiceCircuitBreaker
                fallbackUri: forward:/fallback/ai-service

        # Notification Service Routes
        - id: notification-route
          uri: http://localhost:8085
          predicates:
            - Path=/notifications/**
          filters:
            - name: CircuitBreaker
              args:
                name: notificationServiceCircuitBreaker
                fallbackUri: forward:/fallback/notification-service

        # Payment Service Routes
        - id: payment-route
          uri: http://localhost:8086
          predicates:
            - Path=/payments/**
          filters:
            - name: CircuitBreaker
              args:
                name: paymentServiceCircuitBreaker
                fallbackUri: forward:/fallback/payment-service

        # Actuator Routes for Downstream Services
        - id: user-service-actuator
          uri: http://localhost:8081
          predicates:
            - Path=/services/user-service/actuator/**
          filters:
            - StripPrefix=2

        - id: trip-service-actuator
          uri: http://localhost:8082
          predicates:
            - Path=/services/trip-service/actuator/**
          filters:
            - StripPrefix=2

        - id: chat-service-actuator
          uri: http://localhost:8083
          predicates:
            - Path=/services/chat-service/actuator/**
          filters:
            - StripPrefix=2

        - id: ai-service-actuator
          uri: http://localhost:8084
          predicates:
            - Path=/services/ai-service/actuator/**
          filters:
            - StripPrefix=2

        - id: notification-service-actuator
          uri: http://localhost:8085
          predicates:
            - Path=/services/notification-service/actuator/**
          filters:
            - StripPrefix=2

        - id: payment-service-actuator
          uri: http://localhost:8086
          predicates:
            - Path=/services/payment-service/actuator/**
          filters:
            - StripPrefix=2

trippy:
  gateway:
    jwks-uri: ${JWKS_URI:http://localhost:8081/.well-known/jwks.json}
    downstream-services:
      user-service: http://localhost:8081
      trip-service: http://localhost:8082
      chat-service: http://localhost:8083
      ai-service: http://localhost:8084
      notification-service: http://localhost:8085
      payment-service: http://localhost:8086

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,gateway
  endpoint:
    health:
      show-details: when-authorized
      probes:
        enabled: true
    gateway:
      enabled: true
  health:
    defaults:
      enabled: true
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true
    redis:
      enabled: true

info:
  app:
    name: Trippy API Gateway
    version: 0.2.0
    description: API Gateway for Trippy platform

logging:
  level:
    org.springframework.cloud.gateway: DEBUG
    pse.trippy.apigateway: DEBUG
