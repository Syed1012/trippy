<svg xmlns="http://www.w3.org/2000/svg"
     width="1200" height="380" viewBox="0 0 1200 380"
     role="img" aria-labelledby="hero-title hero-desc">
  <title id="hero-title">trip-service — Trippy platform core service</title>
  <desc id="hero-desc">trip-service owns trips, day-by-day itineraries, role-based participants and group voting, rendered here as a real day-by-day route with activity chips, a vote count and the DRAFT to PLANNED status change.</desc>

  <defs>
    <radialGradient id="glow" cx="18%" cy="12%" r="65%">
      <stop offset="0%" stop-color="#123c69" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#0b2744" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="380" rx="28" fill="#0b2744"/>
  <rect width="1200" height="380" rx="28" fill="url(#glow)"/>

  <!-- vertical divider between title and route -->
  <line x1="676" y1="56" x2="676" y2="324" stroke="#2f4d6b" stroke-width="1"/>

  <!-- ── Title block ─────────────────────────────────────────── -->
  <g id="title-block" transform="translate(64 0)">
    <text x="0" y="76" font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
          font-size="15" letter-spacing="3" fill="#e76f51" font-weight="600">TRIPPY PLATFORM · CORE SERVICE</text>

    <text x="0" y="146" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
          font-size="58" font-weight="800" fill="#fbf8f2">trip-service</text>

    <text x="0" y="192" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
          font-size="20" fill="#c3d3e2">Trips, itineraries and role-based participants —</text>
    <text x="0" y="220" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
          font-size="20" fill="#c3d3e2">the domain the rest of Trippy is built on.</text>

    <text x="0" y="304" font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
          font-size="15" fill="#7e9bb8">:8082 · Java 21 · Spring Boot 3.4 · PostgreSQL (trip_schema)</text>
  </g>

  <!-- ── Native material: a real day-by-day itinerary route ─────── -->
  <g id="itinerary-route" transform="translate(0 0)" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">
    <path d="M 760 120 Q 850 195 940 165 T 1120 118" fill="none" stroke="#4b6f93" stroke-width="2"/>

    <!-- Day 1 -->
    <circle cx="760" cy="120" r="9" fill="#e76f51" stroke="#fbf8f2" stroke-width="2"/>
    <text x="760" y="98" font-size="12" fill="#9db4cc" text-anchor="middle">DAY 1</text>
    <rect x="706" y="140" width="108" height="24" rx="12" fill="#123c69" stroke="#2f4d6b"/>
    <text x="760" y="156" font-size="12" fill="#e5edf5" text-anchor="middle">Museum · Lunch</text>

    <!-- Day 2 -->
    <circle cx="940" cy="165" r="9" fill="#e76f51" stroke="#fbf8f2" stroke-width="2"/>
    <text x="940" y="205" font-size="12" fill="#9db4cc" text-anchor="middle">DAY 2</text>
    <rect x="893" y="118" width="94" height="24" rx="12" fill="#123c69" stroke="#2f4d6b"/>
    <text x="940" y="134" font-size="12" fill="#e5edf5" text-anchor="middle">▲ 3 votes</text>

    <!-- Day 3 -->
    <circle cx="1120" cy="118" r="9" fill="#e76f51" stroke="#fbf8f2" stroke-width="2"/>
    <text x="1120" y="96" font-size="12" fill="#9db4cc" text-anchor="middle">DAY 3</text>
    <rect x="1042" y="138" width="156" height="26" rx="13" fill="none" stroke="#e76f51" stroke-width="1.5"/>
    <text x="1120" y="155" font-size="12" fill="#f2b4a4" text-anchor="middle">DRAFT → PLANNED</text>

    <text x="760" y="290" font-size="13" fill="#7e9bb8">Itinerary · Participants · Voting</text>
  </g>
</svg>
