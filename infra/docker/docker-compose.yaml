# =============================================================================
# Trippy Platform - Full Stack Docker Compose (Infra + Microservices + Frontend)
# =============================================================================

name: trippy

services:
  # ===========================================================================
  # POSTGRESQL - Primary Database
  # ===========================================================================
  postgres:
    image: postgres:16-alpine
    container_name: trippy-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: ${POSTGRES_DB:-trippy_db}
      POSTGRES_USER: ${POSTGRES_USER:-trippy_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=en_US.UTF-8"
      PGDATA: /var/lib/postgresql/data/pgdata

    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-scripts/postgres:/docker-entrypoint-initdb.d:ro

    ports:
      - "${POSTGRES_PORT:-5432}:5432"

    networks:
      - trippy-network

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-trippy_admin} -d ${POSTGRES_DB:-trippy_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ===========================================================================
  # REDIS - Caching, Session Store
  # ===========================================================================
  redis:
    image: redis:7-alpine
    container_name: trippy-redis
    restart: unless-stopped

    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD}
      --maxmemory ${REDIS_MAXMEMORY:-512mb}
      --maxmemory-policy ${REDIS_MAXMEMORY_POLICY:-allkeys-lru}
      --appendonly yes

    volumes:
      - redis_data:/data

    ports:
      - "${REDIS_PORT:-6379}:6379"

    networks:
      - trippy-network

    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ===========================================================================
  # RABBITMQ - Message Broker
  # ===========================================================================
  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: trippy-rabbitmq
    hostname: trippy-rabbitmq
    restart: unless-stopped

    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER:-trippy_mq}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS}
      RABBITMQ_DEFAULT_VHOST: ${RABBITMQ_DEFAULT_VHOST:-trippy}

    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
      - ./init-scripts/rabbitmq/rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro
      - ./init-scripts/rabbitmq/enabled_plugins:/etc/rabbitmq/enabled_plugins:ro
      - ./init-scripts/rabbitmq/definitions.json:/etc/rabbitmq/definitions.json:ro

    ports:
      - "${RABBITMQ_PORT:-5672}:5672"
      - "${RABBITMQ_MANAGEMENT_PORT:-15672}:15672"
      - "61613:61613"

    networks:
      - trippy-network

    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_running"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ===========================================================================
  # MICROSERVICES
  # ===========================================================================
  user-service:
    build:
      context: ../..
      dockerfile: services/user-service/Dockerfile
    container_name: trippy-user-service
    restart: unless-stopped
    ports:
      - "8081:8081"
    environment:
      SPRING_CONFIG_IMPORT: ""
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-trippy_db}
      DB_USERNAME: ${POSTGRES_USER:-trippy_admin}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      MQ_USERNAME: ${RABBITMQ_DEFAULT_USER:-trippy_mq}
      MQ_PASSWORD: ${RABBITMQ_DEFAULT_PASS}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - trippy-network

  trip-service:
    build:
      context: ../..
      dockerfile: services/trip-service/Dockerfile
    container_name: trippy-trip-service
    restart: unless-stopped
    ports:
      - "8082:8082"
    environment:
      SPRING_CONFIG_IMPORT: ""
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-trippy_db}
      DB_USERNAME: ${POSTGRES_USER:-trippy_admin}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      MQ_USERNAME: ${RABBITMQ_DEFAULT_USER:-trippy_mq}
      MQ_PASSWORD: ${RABBITMQ_DEFAULT_PASS}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - trippy-network

  chat-service:
    build:
      context: ../..
      dockerfile: services/chat-service/Dockerfile
    container_name: trippy-chat-service
    restart: unless-stopped
    ports:
      - "8083:8083"
    environment:
      SPRING_CONFIG_IMPORT: ""
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-trippy_db}
      DB_USERNAME: ${POSTGRES_USER:-trippy_admin}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      MQ_USERNAME: ${RABBITMQ_DEFAULT_USER:-trippy_mq}
      MQ_PASSWORD: ${RABBITMQ_DEFAULT_PASS}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - trippy-network

  ai-service:
    build:
      context: ../..
      dockerfile: services/ai-service/Dockerfile
    container_name: trippy-ai-service
    restart: unless-stopped
    ports:
      - "8084:8084"
    environment:
      SPRING_CONFIG_IMPORT: ""
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-trippy_db}
      DB_USERNAME: ${POSTGRES_USER:-trippy_admin}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      MQ_USERNAME: ${RABBITMQ_DEFAULT_USER:-trippy_mq}
      MQ_PASSWORD: ${RABBITMQ_DEFAULT_PASS}
      GROQ_API_KEY: ${GROQ_API_KEY}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - trippy-network

  notification-service:
    build:
      context: ../..
      dockerfile: services/notification-service/Dockerfile
    container_name: trippy-notification-service
    restart: unless-stopped
    ports:
      - "8085:8085"
    environment:
      SPRING_CONFIG_IMPORT: ""
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-trippy_db}
      DB_USERNAME: ${POSTGRES_USER:-trippy_admin}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      MQ_USERNAME: ${RABBITMQ_DEFAULT_USER:-trippy_mq}
      MQ_PASSWORD: ${RABBITMQ_DEFAULT_PASS}
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY}
      VAPID_SUBJECT: ${VAPID_SUBJECT}
      MAIL_USERNAME: ${MAIL_USERNAME}
      MAIL_PASSWORD: ${MAIL_PASSWORD}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - trippy-network

  payment-service:
    build:
      context: ../..
      dockerfile: services/payment-service/Dockerfile
    container_name: trippy-payment-service
    restart: unless-stopped
    ports:
      - "8086:8086"
    environment:
      SPRING_CONFIG_IMPORT: ""
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-trippy_db}
      DB_USERNAME: ${POSTGRES_USER:-trippy_admin}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      MQ_USERNAME: ${RABBITMQ_DEFAULT_USER:-trippy_mq}
      MQ_PASSWORD: ${RABBITMQ_DEFAULT_PASS}
      STRIPE_API_KEY: ${STRIPE_API_KEY}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - trippy-network

  api-gateway:
    build:
      context: ../..
      dockerfile: services/api-gateway/Dockerfile
    container_name: trippy-api-gateway
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      SPRING_CONFIG_IMPORT: ""
      USER_SERVICE_URL: http://user-service:8081
      TRIP_SERVICE_URL: http://trip-service:8082
      CHAT_SERVICE_URL: http://chat-service:8083
      AI_SERVICE_URL: http://ai-service:8084
      NOTIFICATION_SERVICE_URL: http://notification-service:8085
      PAYMENT_SERVICE_URL: http://payment-service:8086
      CHAT_SERVICE_WS_URL: ws://chat-service:8083
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    depends_on:
      - user-service
      - trip-service
      - chat-service
      - ai-service
      - notification-service
      - payment-service
    networks:
      - trippy-network

  # ===========================================================================
  # FRONTEND
  # ===========================================================================
  frontend:
    build:
      context: ../..
      dockerfile: frontend/Dockerfile
    container_name: trippy-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8080
    depends_on:
      - api-gateway
    networks:
      - trippy-network

# =============================================================================
# NETWORKS
# =============================================================================
networks:
  trippy-network:
    driver: bridge
    name: trippy-network
    ipam:
      driver: default
      config:
        - subnet: ${NETWORK_SUBNET:-172.28.0.0/16}

# =============================================================================
# VOLUMES
# =============================================================================
volumes:
  postgres_data:
    driver: local
    name: trippy-postgres-data

  redis_data:
    driver: local
    name: trippy-redis-data

  rabbitmq_data:
    driver: local
    name: trippy-rabbitmq-data
