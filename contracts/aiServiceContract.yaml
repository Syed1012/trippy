openapi: 3.0.3
info:
  title: AI Service API
  description: |
    AI microservice for the Trippy platform. Provides destination discovery,
    itinerary generation, travel advice, group preference consolidation,
    local-Ollama itinerary recommendations (AI sidebar), and trip cover image generation.
  version: 2.0.0
servers:
  - url: http://localhost:8084
    description: Direct
  - url: http://localhost:8080
    description: Via API Gateway

tags:
  - name: Discovery
  - name: Advice
  - name: Chat
  - name: Itinerary
  - name: Preferences
  - name: Recommendations
  - name: Images
  - name: Places

paths:
  /ai/destination-suggestions:
    post:
      tags: [Discovery]
      summary: Suggest destinations
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DestinationSuggestionRequest'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DestinationSuggestionResponse'

  /ai/travel-advice:
    post:
      tags: [Advice]
      summary: Travel Q&A
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TravelAdviceRequest'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TravelAdviceResponse'

  /ai/chat:
    post:
      tags: [Chat]
      summary: Conversational trip assistant
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AiChatRequest'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AiChatResponse'

  /ai/itineraries:
    post:
      tags: [Itinerary]
      summary: Generate full itinerary (S2S)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GenerateItineraryRequest'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ItineraryGenerationResponse'

  /ai/itineraries/{generationId}/retry:
    post:
      tags: [Itinerary]
      summary: Retry a failed or fallback itinerary generation
      parameters:
        - name: generationId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ItineraryGenerationResponse'
        '400':
          description: Invalid generation ID
        '409':
          description: Retry limit exceeded

  /ai/preferences/consolidate:
    post:
      tags: [Preferences]
      summary: Consolidate group preferences (S2S)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GroupPreferenceRequest'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConsolidatedPreferencesResponse'

  /ai/recommendations:
    post:
      tags: [Recommendations]
      summary: Generate itinerary suggestions via local Ollama
      description: 3 options per day. Set dayNumber to regenerate a single day only.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RecommendationRequest'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecommendationResponse'

  /ai/recommendations/{tripId}:
    get:
      tags: [Recommendations]
      summary: Get stored recommendations
      parameters:
        - name: tripId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecommendationResponse'

  /ai/trip-images:
    post:
      tags: [Images]
      summary: Generate trip cover image URL
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TripImageRequest'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TripImageResponse'

  /ai/places/insights:
    post:
      tags: [Places]
      summary: Model-written ratings + reviews for day-map place search results
      description: >
        Stateless. The local Ollama model writes a rating, review count and two
        short reviews per place; falls back to deterministic seeded values
        (source=FALLBACK) when the model is unavailable — never errors mid-demo.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PlaceInsightsRequest'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlaceInsightsResponse'
        '400':
          description: Empty places list or invalid fields

  /ai/places/rank:
    post:
      tags: [Places]
      summary: Top-3 ranking of searched places with per-place reasoning
      description: >
        Stateless. Given the search intent and candidates (with ratings/review
        snippets), the model picks the top 3 and explains each choice; falls
        back to a rating-sorted ranking (source=FALLBACK) when unavailable.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PlaceRankRequest'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlaceRankResponse'
        '400':
          description: Blank query or empty places list

components:
  schemas:
    DestinationSuggestionRequest:
      type: object
      properties:
        prompt: { type: string }
        city: { type: string }
        interests: { type: array, items: { type: string } }
        budget: { type: string }
        travelStyle: { type: string }
        duration: { type: integer, minimum: 1, maximum: 30 }
        region: { type: string }
        month: { type: string }
        people: { type: integer }
        diet: { type: string }
        preferences: { type: string }
        customNotes: { type: string }

    DestinationSuggestionResponse:
      type: object
      properties:
        suggestions:
          type: array
          items:
            type: object
            properties:
              destination: { type: string }
              country: { type: string }
              description: { type: string }
              highlights: { type: array, items: { type: string } }
              estimatedDailyCost: { type: number }
              bestTimeToVisit: { type: string }
              googleMapsUrl: { type: string }
              matchScore: { type: number }
        generatedAt: { type: string, format: date-time }
        cached: { type: boolean }

    TravelAdviceRequest:
      type: object
      required: [question, destination]
      properties:
        question: { type: string, maxLength: 500 }
        destination: { type: string }
        context: { type: string, maxLength: 1000 }

    TravelAdviceResponse:
      type: object
      properties:
        answer: { type: string }
        relatedQuestions: { type: array, items: { type: string } }
        generatedAt: { type: string, format: date-time }

    AiChatRequest:
      type: object
      required: [messages]
      properties:
        messages:
          type: array
          items:
            type: object
            properties:
              role: { type: string }
              content: { type: string, maxLength: 2000 }
        tripContext: { type: string, maxLength: 2000 }
        currentItinerary: { type: array, items: { type: object } }
        destination: { type: string }

    AiChatResponse:
      type: object
      properties:
        reply: { type: string }
        updatedItinerary: { type: array, items: { type: object } }
        changes:
          type: array
          items:
            type: object
            properties:
              type: { type: string }
              dayNumber: { type: integer }
              removed: { type: string }
              added: { type: string }
              summary: { type: string }
        hasModification: { type: boolean }

    GenerateItineraryRequest:
      type: object
      required: [constraints]
      properties:
        tripId: { type: string, format: uuid }
        constraints:
          type: object
          required: [destination, startDate, endDate]
          properties:
            destination: { type: string }
            startDate: { type: string, format: date }
            endDate: { type: string, format: date }
            budgetLevel: { type: string }
            travelers:
              type: object
              properties:
                adults: { type: integer, minimum: 1 }
                children: { type: integer, minimum: 0 }
            accommodationType: { type: string }
        userPrompt: { type: string, maxLength: 1000 }
        tone: { type: string }
        preferences:
          type: object
          properties:
            includeTransport: { type: boolean }
            includeMeals: { type: boolean }
            includeAccommodation: { type: boolean }
            pacePreference: { type: string }
            mustSeeAttractions: { type: array, items: { type: string } }
            avoidAttractions: { type: array, items: { type: string } }

    ItineraryGenerationResponse:
      type: object
      properties:
        generationId: { type: string, format: uuid }
        tripTitle: { type: string }
        summary: { type: string }
        totalEstimatedCost: { type: string }
        dailyPlan: { type: array, items: { type: object } }
        packingTips: { type: array, items: { type: string } }
        travelTips: { type: array, items: { type: string } }
        generatedAt: { type: string, format: date-time }
        tokensUsed: { type: integer }
        fallbackUsed: { type: boolean }
        fallbackReason: { type: string }

    GroupPreferenceRequest:
      type: object
      required: [tripId, preferences]
      properties:
        tripId: { type: string, format: uuid }
        preferences:
          type: array
          items:
            type: object
            properties:
              userId: { type: string, format: uuid }
              interests: { type: array, items: { type: string } }
              budgetPreference: { type: string }
              pacePreference: { type: string }
              mustSee: { type: array, items: { type: string } }
              avoid: { type: array, items: { type: string } }

    ConsolidatedPreferencesResponse:
      type: object
      properties:
        recommendedBudget: { type: string }
        recommendedPace: { type: string }
        sharedInterests: { type: array, items: { type: string } }
        mustSeeConsensus: { type: array, items: { type: string } }
        conflicts:
          type: array
          items:
            type: object
            properties:
              topic: { type: string }
              description: { type: string }
        suggestedPrompt: { type: string }

    RecommendationRequest:
      type: object
      required: [destination, days]
      properties:
        tripId: { type: string, format: uuid }
        destination: { type: string }
        days: { type: integer, minimum: 1, maximum: 60 }
        dayNumber: { type: integer }
        preferences:
          type: object
          properties:
            tripType: { type: string }
            budgetTier: { type: string, enum: [ECONOMY, MODERATE, LUXURY] }
            preferredWeather: { type: string }
            notes: { type: string }
        existingItinerary:
          type: array
          items:
            type: object
            properties:
              dayNumber: { type: integer }
              title: { type: string }
              activities:
                type: array
                items:
                  type: object
                  properties:
                    time: { type: string }
                    title: { type: string }
                    estimatedCost: { type: string }

    RecommendationResponse:
      type: object
      properties:
        tripId: { type: string, format: uuid }
        model: { type: string }
        source: { type: string, enum: [AI, FALLBACK] }
        generatedAt: { type: string, format: date-time }
        days:
          type: array
          items:
            type: object
            properties:
              dayNumber: { type: integer }
              options:
                type: array
                items:
                  type: object
                  properties:
                    id: { type: string, format: uuid }
                    vibe: { type: string, enum: [Top Pick, Adventurer, Hidden Gem] }
                    title: { type: string }
                    startTime: { type: string }
                    endTime: { type: string }
                    cost: { type: number }
                    currency: { type: string }
                    mapsUrl: { type: string }
                    notes: { type: string }

    TripImageRequest:
      type: object
      required: [destination]
      properties:
        tripId: { type: string, format: uuid }
        destination: { type: string }
        preferences:
          type: object
          properties:
            tripType: { type: string }
            budgetTier: { type: string }
            preferredWeather: { type: string }
            notes: { type: string }

    TripImageResponse:
      type: object
      properties:
        tripId: { type: string, format: uuid }
        imageUrl: { type: string, nullable: true }
        prompt: { type: string }
        model: { type: string }
        source: { type: string, enum: [AI, FALLBACK, DISABLED] }
        status: { type: string, enum: [READY, DISABLED] }

    PlaceInsightsRequest:
      type: object
      required: [places]
      properties:
        places:
          type: array
          minItems: 1
          maxItems: 10
          items:
            type: object
            required: [id, name]
            properties:
              id: { type: string }
              name: { type: string, maxLength: 200 }
              category: { type: string, maxLength: 100 }
              address: { type: string, maxLength: 300 }

    PlaceInsightsResponse:
      type: object
      properties:
        source: { type: string, enum: [AI, FALLBACK] }
        model: { type: string }
        places:
          type: array
          items:
            type: object
            properties:
              id: { type: string }
              rating: { type: number, description: "3.0-5.0, one decimal" }
              reviewCount: { type: integer }
              reviews:
                type: array
                maxItems: 2
                items:
                  type: object
                  properties:
                    author: { type: string }
                    rating: { type: integer, minimum: 1, maximum: 5 }
                    when: { type: string, description: "relative time, e.g. '3 weeks ago'" }
                    text: { type: string }

    PlaceRankRequest:
      type: object
      required: [query, places]
      properties:
        query: { type: string, maxLength: 200, description: "the user's search intent" }
        places:
          type: array
          minItems: 1
          maxItems: 10
          items:
            type: object
            required: [id, name]
            properties:
              id: { type: string }
              name: { type: string, maxLength: 200 }
              category: { type: string, maxLength: 100 }
              address: { type: string, maxLength: 300 }
              rating: { type: number, nullable: true }
              reviewCount: { type: integer, nullable: true }
              reviewSnippets:
                type: array
                maxItems: 6
                nullable: true
                items: { type: string }

    PlaceRankResponse:
      type: object
      properties:
        source: { type: string, enum: [AI, FALLBACK] }
        model: { type: string }
        summary: { type: string, nullable: true }
        rankings:
          type: array
          maxItems: 3
          items:
            type: object
            properties:
              placeId: { type: string }
              rank: { type: integer, minimum: 1, maximum: 3 }
              name: { type: string }
              reason: { type: string }
