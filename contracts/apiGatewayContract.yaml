openapi: 3.0.3
info:
  title: API Gateway Contract
  description: |
    Spring Cloud Gateway configuration for the Trippy platform.
    Routes all external traffic to the appropriate microservice. Validates JWTs
    and injects X-User-Id, X-User-Role, X-User-Email, X-User-Plan headers for
    downstream services.
  version: 2.0.0
servers:
  - url: http://localhost:8080
    description: Gateway (public entry point)

x-gateway-routes:
  - id: auth-route
    predicates: ["/auth/**"]
    upstream: http://localhost:8081
    notes: User service — auth endpoints (no JWT required)

  - id: users-route
    predicates: ["/users/**"]
    upstream: http://localhost:8081
    notes: User service — profiles, preferences, search, batch

  - id: wellknown-route
    predicates: ["/.well-known/**"]
    upstream: http://localhost:8081
    notes: JWKS public key (no JWT required)

  - id: trips-chat-route
    predicates: ["/trips/{tripId}/chat/**"]
    upstream: http://localhost:8083
    notes: Chat service — per-trip messaging (must precede trips-route)

  - id: trips-route
    predicates: ["/trips/**"]
    upstream: http://localhost:8082
    notes: Trip service — CRUD, itinerary, participants, voting, comments

  - id: chats-route
    predicates: ["/chats/**"]
    upstream: http://localhost:8083
    notes: Chat service — attachments, participants

  - id: admin-chat-route
    predicates: ["/admin/chat/**"]
    upstream: http://localhost:8083
    notes: Chat moderation (ADMIN role required)

  - id: websocket-route
    predicates: ["/ws/**"]
    upstream: http://localhost:8083
    notes: WebSocket/STOMP endpoint for real-time chat

  - id: ai-route
    predicates: ["/ai/**"]
    upstream: http://localhost:8084
    notes: AI service — suggestions, recommendations, images, itinerary gen

  - id: notification-route
    predicates: ["/notifications/**"]
    upstream: http://localhost:8085
    notes: Notification service — in-app notifications + email (S2S)

  - id: payment-route
    predicates: ["/payments/**"]
    upstream: http://localhost:8086
    notes: Payment service — plans, checkout, subscriptions

x-gateway-filters:
  jwt-validation:
    description: |
      Validates the Authorization Bearer token against the JWKS endpoint
      (JWKS_URI env, default http://localhost:8081/.well-known/jwks.json).
      On success, strips the Authorization header and injects:
      - X-User-Id (UUID from sub claim)
      - X-User-Role (from role claim)
      - X-User-Email (from email claim)
      - X-User-Plan (from plan claim)
    excluded-paths:
      - /auth/**
      - /.well-known/**
      - /payments/webhook

x-gateway-cors:
  allowed-origins: ["http://localhost:3000"]
  allowed-methods: ["GET", "POST", "PUT", "PATCH", "DELETE", "OPTIONS"]
  allowed-headers: ["*"]
  exposed-headers: ["X-Correlation-Id"]
  allow-credentials: true
