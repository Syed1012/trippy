openapi: 3.0.3
info:
  title: Chat Service API
  description: |
    Chat microservice for the Trippy platform. Provides per-trip real-time
    messaging (REST + WebSocket/STOMP), file attachments, and admin moderation.
  version: 2.0.0
servers:
  - url: http://localhost:8083
    description: Direct
  - url: http://localhost:8080
    description: Via API Gateway

tags:
  - name: Messages
  - name: Files
  - name: Rooms
  - name: Participants
  - name: Moderation
  - name: WebSocket

paths:
  /trips/{tripId}/chat/messages:
    get:
      tags: [Messages]
      summary: Get message history (paginated)
      parameters:
        - $ref: '#/components/parameters/TripId'
        - name: page
          in: query
          schema: { type: integer, default: 0 }
        - name: size
          in: query
          schema: { type: integer, default: 50 }
        - name: before
          in: query
          description: Fetch messages before this timestamp
          schema: { type: string, format: date-time }
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageHistoryResponse'
    post:
      tags: [Messages]
      summary: Send a text message
      parameters:
        - $ref: '#/components/parameters/TripId'
        - name: X-User-Id
          in: header
          required: true
          schema: { type: string }
        - name: X-User-DisplayName
          in: header
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [content]
              properties:
                content: { type: string, maxLength: 4000 }
                type: { type: string, default: TEXT }
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatMessageResponse'

  /trips/{tripId}/chat/messages/file:
    post:
      tags: [Files]
      summary: Upload a file message (multipart)
      parameters:
        - $ref: '#/components/parameters/TripId'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file: { type: string, format: binary }
                senderId: { type: string, format: uuid }
                senderDisplayName: { type: string }
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatMessageResponse'

  /chats/{tripId}/attachments:
    get:
      tags: [Files]
      summary: List all attachments for a trip
      parameters:
        - $ref: '#/components/parameters/TripId'
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/MessageAttachmentResponse'

  /chats/files/{tripId}/{filename}:
    get:
      tags: [Files]
      summary: Download a file
      parameters:
        - $ref: '#/components/parameters/TripId'
        - name: filename
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          content:
            application/octet-stream:
              schema: { type: string, format: binary }

  /chats/files/{tripId}/thumbs/{filename}:
    get:
      tags: [Files]
      summary: Download thumbnail
      parameters:
        - $ref: '#/components/parameters/TripId'
        - name: filename
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          content:
            image/jpeg:
              schema: { type: string, format: binary }

  /trips/{tripId}/chat/rooms:
    post:
      tags: [Rooms]
      summary: Create a chat room for a trip
      parameters:
        - $ref: '#/components/parameters/TripId'
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatRoomResponse'

  /chats/{tripId}/participants:
    get:
      tags: [Participants]
      summary: Get connected WebSocket participants
      parameters:
        - $ref: '#/components/parameters/TripId'
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items: { type: string, format: uuid }

  /admin/chat/users/{userId}/ban:
    post:
      tags: [Moderation]
      summary: Ban a user from chat
      parameters:
        - name: userId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: durationMinutes
          in: query
          schema: { type: integer, default: 0, description: "0 = permanent" }
      responses:
        '204':
          description: Banned
    delete:
      tags: [Moderation]
      summary: Unban a user
      parameters:
        - name: userId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '204':
          description: Unbanned

  /admin/chat/users/{userId}/mute:
    post:
      tags: [Moderation]
      summary: Mute a user
      parameters:
        - name: userId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: durationMinutes
          in: query
          schema: { type: integer, default: 0 }
      responses:
        '204':
          description: Muted
    delete:
      tags: [Moderation]
      summary: Unmute a user
      parameters:
        - name: userId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '204':
          description: Unmuted

  /admin/chat/messages/{messageId}:
    delete:
      tags: [Moderation]
      summary: Admin soft-delete a message
      parameters:
        - name: messageId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '204':
          description: Deleted

components:
  parameters:
    TripId:
      name: tripId
      in: path
      required: true
      schema: { type: string, format: uuid }

  schemas:
    ChatMessageResponse:
      type: object
      properties:
        id: { type: string, format: uuid }
        senderId: { type: string, format: uuid }
        senderDisplayName: { type: string }
        content: { type: string }
        type: { type: string }
        createdAt: { type: string, format: date-time }
        edited: { type: boolean }
        attachment:
          $ref: '#/components/schemas/MessageAttachmentResponse'

    MessageHistoryResponse:
      type: object
      properties:
        messages:
          type: array
          items:
            $ref: '#/components/schemas/ChatMessageResponse'
        page: { type: integer }
        size: { type: integer }
        totalMessages: { type: integer }
        hasMore: { type: boolean }

    ChatRoomResponse:
      type: object
      properties:
        id: { type: string, format: uuid }
        tripId: { type: string, format: uuid }
        createdAt: { type: string, format: date-time }

    MessageAttachmentResponse:
      type: object
      properties:
        id: { type: string, format: uuid }
        fileName: { type: string }
        fileUrl: { type: string }
        fileSize: { type: integer }
        contentType: { type: string }
        thumbnailUrl: { type: string }

  x-websocket:
    stomp-endpoint: /ws
    destinations:
      send-message:
        destination: /app/trips/{tripId}/send
        payload:
          type: object
          properties:
            content: { type: string }
            type: { type: string }
        broadcasts-to: /topic/trips/{tripId}/messages
      typing-indicator:
        destination: /app/trips/{tripId}/typing
        payload:
          type: object
          properties:
            typing: { type: boolean }
        broadcasts-to: /topic/trips/{tripId}/typing
