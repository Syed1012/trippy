openapi: 3.0.3
info:
  title: Notification Service API
  description: |
    Notification microservice for the Trippy platform. In-app notifications,
    transactional email sending, and dev-only template preview.
  version: 2.0.0
servers:
  - url: http://localhost:8085
    description: Direct
  - url: http://localhost:8080
    description: Via API Gateway

tags:
  - name: Notifications
  - name: Email
  - name: Templates

paths:
  /notifications:
    get:
      tags: [Notifications]
      summary: List notifications (paginated)
      parameters:
        - $ref: '#/components/parameters/XUserId'
        - name: page
          in: query
          schema: { type: integer, default: 0 }
        - name: size
          in: query
          schema: { type: integer, default: 20 }
        - name: unreadOnly
          in: query
          schema: { type: boolean, default: false }
        - name: type
          in: query
          schema: { type: string }
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                properties:
                  content:
                    type: array
                    items:
                      $ref: '#/components/schemas/NotificationResponse'
                  totalElements: { type: integer }
                  totalPages: { type: integer }
                  number: { type: integer }
                  size: { type: integer }

  /notifications/unread-count:
    get:
      tags: [Notifications]
      summary: Get unread count
      parameters:
        - $ref: '#/components/parameters/XUserId'
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                properties:
                  count: { type: integer }
                  unreadCount: { type: integer }

  /notifications/{id}/read:
    patch:
      tags: [Notifications]
      summary: Mark notification as read
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - $ref: '#/components/parameters/XUserId'
      responses:
        '200':
          description: Marked read
    post:
      tags: [Notifications]
      summary: Mark notification as read (alias)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - $ref: '#/components/parameters/XUserId'
      responses:
        '200':
          description: Marked read

  /notifications/read-all:
    patch:
      tags: [Notifications]
      summary: Mark all as read
      parameters:
        - $ref: '#/components/parameters/XUserId'
      responses:
        '200':
          description: All marked read
    post:
      tags: [Notifications]
      summary: Mark all as read (alias)
      parameters:
        - $ref: '#/components/parameters/XUserId'
      responses:
        '200':
          description: All marked read

  /notifications/{id}:
    delete:
      tags: [Notifications]
      summary: Delete a notification
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - $ref: '#/components/parameters/XUserId'
      responses:
        '204':
          description: Deleted

  /notifications/email/send:
    post:
      tags: [Email]
      summary: Send a templated email (S2S)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SendEmailRequest'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmailSentResponse'

  /notifications/email/verification:
    post:
      tags: [Email]
      summary: Send verification email (S2S)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [to, userName, verificationCode]
              properties:
                to: { type: string, format: email }
                userName: { type: string }
                verificationCode: { type: string }
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmailSentResponse'

  /notifications/email/welcome:
    post:
      tags: [Email]
      summary: Send welcome email (S2S)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [to, userName]
              properties:
                to: { type: string, format: email }
                userName: { type: string }
                dashboardUrl: { type: string }
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmailSentResponse'

  /notifications/email/password-reset:
    post:
      tags: [Email]
      summary: Send password reset email (S2S)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [to, userName, resetLink]
              properties:
                to: { type: string, format: email }
                userName: { type: string }
                resetLink: { type: string }
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmailSentResponse'

  /notifications/templates/{name}/preview:
    get:
      tags: [Templates]
      summary: Preview email template HTML (dev profile only)
      parameters:
        - name: name
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          content:
            text/html:
              schema: { type: string }

components:
  parameters:
    XUserId:
      name: X-User-Id
      in: header
      required: true
      schema: { type: string, format: uuid }

  schemas:
    NotificationResponse:
      type: object
      properties:
        id: { type: string, format: uuid }
        notificationId: { type: string, format: uuid }
        userId: { type: string, format: uuid }
        type: { type: string }
        title: { type: string }
        message: { type: string }
        body: { type: string }
        actionUrl: { type: string }
        metadata: { type: object }
        read: { type: boolean }
        createdAt: { type: string, format: date-time }
        readAt: { type: string, format: date-time }

    SendEmailRequest:
      type: object
      required: [to, subject, templateName, templateVariables]
      properties:
        to: { type: string, format: email }
        subject: { type: string, maxLength: 500 }
        templateName: { type: string, pattern: '^[a-z0-9-]+$' }
        templateVariables: { type: object }

    EmailSentResponse:
      type: object
      properties:
        success: { type: boolean }
        message: { type: string }
