openapi: 3.0.3
info:
  title: User Service API
  description: |
    User microservice for the Trippy platform. Handles authentication,
    user profiles, email verification, user search, and trip preferences.
  version: 2.0.0
servers:
  - url: http://localhost:8081
    description: Direct
  - url: http://localhost:8080
    description: Via API Gateway

tags:
  - name: Auth
  - name: Users
  - name: Preferences
  - name: JWKS

paths:
  /auth/register:
    post:
      tags: [Auth]
      summary: Register a new user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegisterResponse'

  /auth/login:
    post:
      tags: [Auth]
      summary: Login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'

  /auth/refresh:
    post:
      tags: [Auth]
      summary: Refresh access token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refreshToken]
              properties:
                refreshToken: { type: string }
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'

  /auth/logout:
    post:
      tags: [Auth]
      summary: Logout (invalidate tokens)
      parameters:
        - name: Authorization
          in: header
          required: true
          schema: { type: string }
        - name: allDevices
          in: query
          schema: { type: boolean, default: false }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refreshToken]
              properties:
                refreshToken: { type: string }
      responses:
        '204':
          description: Logged out

  /users/me:
    get:
      tags: [Users]
      summary: Get current user profile
      parameters:
        - $ref: '#/components/parameters/XUserId'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfileResponse'
    patch:
      tags: [Users]
      summary: Update current user profile
      parameters:
        - $ref: '#/components/parameters/XUserId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateProfileRequest'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfileResponse'

  /users/{userId}:
    get:
      tags: [Users]
      summary: Get public profile
      parameters:
        - name: userId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserPublicProfileResponse'

  /users/search:
    get:
      tags: [Users]
      summary: Search users by name or email
      parameters:
        - name: q
          in: query
          required: true
          schema: { type: string }
        - name: limit
          in: query
          schema: { type: integer, default: 10 }
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/UserPublicProfileResponse'

  /users/batch:
    post:
      tags: [Users]
      summary: Batch get public profiles by user IDs
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items: { type: string, format: uuid }
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/UserPublicProfileResponse'

  /users/verify-email:
    post:
      tags: [Users]
      summary: Verify email with token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties:
                token: { type: string }
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string }

  /users/resend-verification:
    post:
      tags: [Users]
      summary: Resend verification email
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: { type: string, format: email }
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string }

  /users/trip-preferences:
    post:
      tags: [Preferences]
      summary: Save trip-scoped travel preferences
      parameters:
        - $ref: '#/components/parameters/XUserId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SaveTripPreferenceRequest'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TripPreferenceResponse'

  /users/trip-preferences/{tripId}:
    get:
      tags: [Preferences]
      summary: Get preferences for a trip
      parameters:
        - name: tripId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - $ref: '#/components/parameters/XUserId'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TripPreferenceResponse'

  /.well-known/jwks.json:
    get:
      tags: [JWKS]
      summary: JSON Web Key Set for JWT verification
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object

components:
  parameters:
    XUserId:
      name: X-User-Id
      in: header
      required: true
      schema: { type: string }
      description: Injected by API Gateway from JWT

  schemas:
    RegisterRequest:
      type: object
      required: [email, password, displayName]
      properties:
        email: { type: string, format: email }
        password: { type: string, minLength: 8, maxLength: 128 }
        displayName: { type: string, minLength: 2, maxLength: 50 }

    RegisterResponse:
      type: object
      properties:
        userId: { type: string, format: uuid }
        email: { type: string }
        message: { type: string }
        verificationRequired: { type: boolean }

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email }
        password: { type: string }
        rememberMe: { type: boolean, default: false }

    LoginResponse:
      type: object
      properties:
        accessToken: { type: string }
        refreshToken: { type: string }
        expiresIn: { type: integer }
        tokenType: { type: string, default: Bearer }
        user:
          $ref: '#/components/schemas/UserProfileResponse'

    TokenResponse:
      type: object
      properties:
        accessToken: { type: string }
        refreshToken: { type: string }
        expiresIn: { type: integer }

    UpdateProfileRequest:
      type: object
      properties:
        displayName: { type: string, maxLength: 100 }
        bio: { type: string, maxLength: 500 }
        phoneNumber: { type: string, maxLength: 20 }
        country: { type: string, maxLength: 100 }
        avatarUrl: { type: string, maxLength: 2048 }

    UserProfileResponse:
      type: object
      properties:
        id: { type: string, format: uuid }
        email: { type: string }
        displayName: { type: string }
        bio: { type: string }
        phoneNumber: { type: string }
        country: { type: string }
        avatarUrl: { type: string }
        role: { type: string, enum: [USER, ADMIN] }
        plan: { type: string, enum: [FREE, PRO, PREMIUM] }
        emailVerified: { type: boolean }
        createdAt: { type: string, format: date-time }

    UserPublicProfileResponse:
      type: object
      properties:
        id: { type: string, format: uuid }
        displayName: { type: string }
        avatarUrl: { type: string }
        country: { type: string }
        email: { type: string }

    SaveTripPreferenceRequest:
      type: object
      required: [tripId]
      properties:
        tripId: { type: string, format: uuid }
        tripType: { type: string, enum: [BEACH, MOUNTAIN, CITY, NATURE, ADVENTURE, CULTURE] }
        budgetTier: { type: string, enum: [ECONOMY, MODERATE, LUXURY] }
        preferredWeather: { type: string, enum: [WARM, MILD, COLD, ANY] }
        notes: { type: string, maxLength: 500 }

    TripPreferenceResponse:
      type: object
      properties:
        preferenceId: { type: string, format: uuid }
        userId: { type: string, format: uuid }
        tripId: { type: string, format: uuid }
        tripType: { type: string }
        budgetTier: { type: string }
        preferredWeather: { type: string }
        notes: { type: string }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
