openapi: 3.0.3
info:
  title: Payment Service API
  description: |
    Payment microservice for the Trippy platform. Subscription plans,
    checkout, payment methods, transactions, and Stripe webhook handling.
  version: 2.0.0
servers:
  - url: http://localhost:8086
    description: Direct
  - url: http://localhost:8080
    description: Via API Gateway

tags:
  - name: Plans
  - name: Checkout
  - name: Subscription
  - name: Methods
  - name: Transactions
  - name: Webhook

paths:
  /payments/plans:
    get:
      tags: [Plans]
      summary: List available subscription plans
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PlanResponse'

  /payments/checkout:
    post:
      tags: [Checkout]
      summary: Create a checkout session
      parameters:
        - $ref: '#/components/parameters/XUserId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [planId, paymentMethodId]
              properties:
                planId: { type: string }
                paymentMethodId: { type: string }
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CheckoutResponse'

  /payments/subscription/confirm:
    post:
      tags: [Subscription]
      summary: Confirm a payment
      parameters:
        - $ref: '#/components/parameters/XUserId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [planId, paymentMethodId]
              properties:
                planId: { type: string }
                paymentMethodId: { type: string, format: uuid }
                promoCode: { type: string }
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentConfirmationResponse'

  /payments/subscription:
    get:
      tags: [Subscription]
      summary: Get current subscription
      parameters:
        - $ref: '#/components/parameters/XUserId'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubscriptionResponse'

  /payments/subscription/cancel:
    post:
      tags: [Subscription]
      summary: Cancel subscription
      parameters:
        - $ref: '#/components/parameters/XUserId'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                cancelImmediately: { type: boolean, default: false }
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubscriptionResponse'

  /payments/transactions:
    get:
      tags: [Transactions]
      summary: List transactions
      parameters:
        - $ref: '#/components/parameters/XUserId'
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TransactionResponse'

  /payments/methods:
    post:
      tags: [Methods]
      summary: Add a payment method
      parameters:
        - $ref: '#/components/parameters/XUserId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddPaymentMethodRequest'
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentMethodResponse'
    get:
      tags: [Methods]
      summary: List payment methods
      parameters:
        - $ref: '#/components/parameters/XUserId'
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PaymentMethodResponse'

  /payments/methods/{paymentMethodId}:
    delete:
      tags: [Methods]
      summary: Delete a payment method
      parameters:
        - $ref: '#/components/parameters/XUserId'
        - name: paymentMethodId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '204':
          description: Deleted

  /payments/webhook:
    post:
      tags: [Webhook]
      summary: Stripe webhook handler
      parameters:
        - name: Stripe-Signature
          in: header
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: string }
      responses:
        '200':
          content:
            text/plain:
              schema: { type: string }

components:
  parameters:
    XUserId:
      name: X-User-Id
      in: header
      required: true
      schema: { type: string, format: uuid }

  schemas:
    PlanResponse:
      type: object
      properties:
        planId: { type: string }
        displayName: { type: string }
        price: { type: number }
        currency: { type: string }
        features: { type: array, items: { type: string } }

    CheckoutResponse:
      type: object
      properties:
        transactionId: { type: string, format: uuid }
        status: { type: string }
        plan: { type: string }
        amount:
          type: object
          properties:
            value: { type: number }
            currency: { type: string }
        message: { type: string }

    PaymentConfirmationResponse:
      type: object
      properties:
        transactionId: { type: string, format: uuid }
        status: { type: string }
        subscription:
          $ref: '#/components/schemas/SubscriptionResponse'
        verificationReference: { type: string }
        confirmedAt: { type: string, format: date-time }

    SubscriptionResponse:
      type: object
      properties:
        subscriptionId: { type: string, format: uuid }
        plan: { type: string }
        status: { type: string }
        currentPeriodStart: { type: string, format: date }
        currentPeriodEnd: { type: string, format: date }
        cancelAtPeriodEnd: { type: boolean }
        priceAmount: { type: number }
        currency: { type: string }

    TransactionResponse:
      type: object
      properties:
        transactionId: { type: string, format: uuid }
        type: { type: string }
        amount: { type: number }
        currency: { type: string }
        status: { type: string }
        createdAt: { type: string, format: date-time }

    AddPaymentMethodRequest:
      type: object
      required: [brand, last4, expiryMonth, expiryYear]
      properties:
        brand: { type: string, maxLength: 20 }
        last4: { type: string, minLength: 4, maxLength: 4 }
        expiryMonth: { type: integer }
        expiryYear: { type: integer }
        holderName: { type: string, maxLength: 100 }
        setAsDefault: { type: boolean, default: false }

    PaymentMethodResponse:
      type: object
      properties:
        id: { type: string, format: uuid }
        brand: { type: string }
        last4: { type: string }
        expiryMonth: { type: integer }
        expiryYear: { type: integer }
        holderName: { type: string }
        isDefault: { type: boolean }
        createdAt: { type: string, format: date-time }
