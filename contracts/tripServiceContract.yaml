openapi: 3.0.3
info:
  title: Trip Service API
  description: |
    Trip microservice for the Trippy platform. Manages trips, itineraries,
    participants, voting, and activity comments.
  version: 2.0.0
servers:
  - url: http://localhost:8082
    description: Direct
  - url: http://localhost:8080
    description: Via API Gateway

tags:
  - name: Trips
  - name: Itinerary
  - name: Participants
  - name: Voting
  - name: Comments

paths:
  /trips:
    post:
      tags: [Trips]
      summary: Create a trip
      parameters:
        - $ref: '#/components/parameters/XUserId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTripRequest'
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TripResponse'
    get:
      tags: [Trips]
      summary: List my trips (paginated)
      parameters:
        - $ref: '#/components/parameters/XUserId'
        - name: page
          in: query
          schema: { type: integer, default: 0 }
        - name: size
          in: query
          schema: { type: integer, default: 10 }
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TripPageResponse'

  /trips/public:
    get:
      tags: [Trips]
      summary: List public trips
      description: >
        Discovery feed of PUBLIC trips the caller does not already participate in.
        DRAFT trips are excluded — a trip is only shared with the platform once its
        itinerary is substantial enough to leave DRAFT (see PUT /trips/{tripId}/itinerary).
        CANCELLED trips are also excluded.
      parameters:
        - $ref: '#/components/parameters/XUserId'
        - name: page
          in: query
          schema: { type: integer, default: 0 }
        - name: size
          in: query
          schema: { type: integer, default: 10 }
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TripPageResponse'

  /trips/{tripId}:
    get:
      tags: [Trips]
      summary: Get trip details
      description: >
        Open access only for a published (non-DRAFT) PUBLIC trip. DRAFT trips — and
        all PRIVATE/UNLISTED trips — require the caller to be an accepted participant,
        otherwise 403. This keeps unpublished DRAFT trips hidden from other users even
        via a direct link.
      parameters:
        - $ref: '#/components/parameters/TripId'
        - $ref: '#/components/parameters/XUserId'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TripDetailResponse'
        '403':
          description: Not a participant of a non-public or DRAFT trip
    patch:
      tags: [Trips]
      summary: Update trip
      parameters:
        - $ref: '#/components/parameters/TripId'
        - $ref: '#/components/parameters/XUserId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateTripRequest'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TripResponse'
    delete:
      tags: [Trips]
      summary: Delete trip
      parameters:
        - $ref: '#/components/parameters/TripId'
        - $ref: '#/components/parameters/XUserId'
      responses:
        '204':
          description: Deleted

  /trips/{tripId}/status:
    patch:
      tags: [Trips]
      summary: Transition trip status
      parameters:
        - $ref: '#/components/parameters/TripId'
        - $ref: '#/components/parameters/XUserId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status: { type: string }
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TripResponse'

  /trips/{tripId}/itinerary:
    get:
      tags: [Itinerary]
      summary: Get itinerary
      parameters:
        - $ref: '#/components/parameters/TripId'
        - $ref: '#/components/parameters/XUserId'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ItineraryResponse'
    put:
      tags: [Itinerary]
      summary: Replace itinerary (full update)
      description: >
        Full replace of the itinerary. Side effect: the trip status is auto-managed
        between DRAFT and PLANNED based on the saved plan. A trip becomes PLANNED
        (published) once at least two days each have an activity, or a single day has
        more than one activity; otherwise it stays/returns to DRAFT. Deliberate later
        states (ONGOING, COMPLETED, CANCELLED) are never changed by this endpoint.
      parameters:
        - $ref: '#/components/parameters/TripId'
        - $ref: '#/components/parameters/XUserId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateItineraryRequest'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ItineraryResponse'

  /trips/{tripId}/participants:
    get:
      tags: [Participants]
      summary: List participants
      parameters:
        - $ref: '#/components/parameters/TripId'
        - $ref: '#/components/parameters/XUserId'
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ParticipantResponse'

  /trips/{tripId}/participants/invite:
    post:
      tags: [Participants]
      summary: Invite a user
      parameters:
        - $ref: '#/components/parameters/TripId'
        - $ref: '#/components/parameters/XUserId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                userId: { type: string, format: uuid }
                email: { type: string }
                message: { type: string }
                inviterName: { type: string }
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ParticipantActionResponse'

  /trips/{tripId}/participants/approve:
    post:
      tags: [Participants]
      summary: Approve a join request (owner only)
      parameters:
        - $ref: '#/components/parameters/TripId'
        - $ref: '#/components/parameters/XUserId'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                userId: { type: string, format: uuid }
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ParticipantActionResponse'

  /trips/{tripId}/participants/reject:
    post:
      tags: [Participants]
      summary: Reject a join request (owner only)
      parameters:
        - $ref: '#/components/parameters/TripId'
        - $ref: '#/components/parameters/XUserId'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                userId: { type: string, format: uuid }
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ParticipantActionResponse'

  /trips/{tripId}/participants/accept:
    post:
      tags: [Participants]
      summary: Accept an invitation
      parameters:
        - $ref: '#/components/parameters/TripId'
        - $ref: '#/components/parameters/XUserId'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ParticipantActionResponse'

  /trips/{tripId}/participants/decline:
    post:
      tags: [Participants]
      summary: Decline an invitation
      parameters:
        - $ref: '#/components/parameters/TripId'
        - $ref: '#/components/parameters/XUserId'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ParticipantActionResponse'

  /trips/{tripId}/participants/request-join:
    post:
      tags: [Participants]
      summary: Request to join a public trip
      parameters:
        - $ref: '#/components/parameters/TripId'
        - $ref: '#/components/parameters/XUserId'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                requesterName: { type: string }
                message: { type: string }
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ParticipantActionResponse'

  /trips/{tripId}/participants/leave:
    delete:
      tags: [Participants]
      summary: Leave a trip
      parameters:
        - $ref: '#/components/parameters/TripId'
        - $ref: '#/components/parameters/XUserId'
      responses:
        '204':
          description: Left

  /trips/{tripId}/participants/kick/{targetUserId}:
    delete:
      tags: [Participants]
      summary: Kick a participant (owner only)
      parameters:
        - $ref: '#/components/parameters/TripId'
        - $ref: '#/components/parameters/XUserId'
        - name: targetUserId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ParticipantActionResponse'

  /trips/{tripId}/itinerary/days/{dayNumber}/vote:
    post:
      tags: [Voting]
      summary: Vote on a day plan
      parameters:
        - $ref: '#/components/parameters/TripId'
        - $ref: '#/components/parameters/XUserId'
        - name: dayNumber
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [voteType]
              properties:
                voteType: { type: string, enum: [UPVOTE, DOWNVOTE] }
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VoteSummaryResponse'
    delete:
      tags: [Voting]
      summary: Remove day vote
      parameters:
        - $ref: '#/components/parameters/TripId'
        - $ref: '#/components/parameters/XUserId'
        - name: dayNumber
          in: path
          required: true
          schema: { type: integer }
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VoteSummaryResponse'

  /trips/{tripId}/itinerary/days/{dayNumber}/votes:
    get:
      tags: [Voting]
      summary: Day vote summary
      parameters:
        - $ref: '#/components/parameters/TripId'
        - $ref: '#/components/parameters/XUserId'
        - name: dayNumber
          in: path
          required: true
          schema: { type: integer }
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VoteSummaryResponse'

  /trips/{tripId}/itinerary/voting-settings:
    put:
      tags: [Voting]
      summary: Update voting settings
      parameters:
        - $ref: '#/components/parameters/TripId'
        - $ref: '#/components/parameters/XUserId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                votingEnabled: { type: boolean }
                votingDeadline: { type: string, format: date-time, nullable: true }
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/VoteSummaryResponse'

  /trips/{tripId}/itinerary/activities/{activityId}/vote:
    post:
      tags: [Voting]
      summary: Vote on an activity
      parameters:
        - $ref: '#/components/parameters/TripId'
        - $ref: '#/components/parameters/XUserId'
        - name: activityId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [voteType]
              properties:
                voteType: { type: string, enum: [UPVOTE, DOWNVOTE] }
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActivityVoteSummaryResponse'
    delete:
      tags: [Voting]
      summary: Remove activity vote
      parameters:
        - $ref: '#/components/parameters/TripId'
        - $ref: '#/components/parameters/XUserId'
        - name: activityId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActivityVoteSummaryResponse'

  /trips/{tripId}/activities/{activityId}/comments:
    get:
      tags: [Comments]
      summary: List activity comments
      parameters:
        - $ref: '#/components/parameters/TripId'
        - name: activityId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CommentResponse'
    post:
      tags: [Comments]
      summary: Add a comment
      parameters:
        - $ref: '#/components/parameters/TripId'
        - $ref: '#/components/parameters/XUserId'
        - name: activityId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [content]
              properties:
                content: { type: string, maxLength: 1000 }
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommentResponse'

  /trips/{tripId}/activities/{activityId}/comments/{commentId}:
    delete:
      tags: [Comments]
      summary: Delete own comment
      parameters:
        - $ref: '#/components/parameters/TripId'
        - $ref: '#/components/parameters/XUserId'
        - name: activityId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: commentId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '204':
          description: Deleted

components:
  parameters:
    TripId:
      name: tripId
      in: path
      required: true
      schema: { type: string, format: uuid }
    XUserId:
      name: X-User-Id
      in: header
      required: true
      schema: { type: string, format: uuid }
      description: Injected by API Gateway from JWT

  schemas:
    CreateTripRequest:
      type: object
      required: [title, destination]
      properties:
        title: { type: string, maxLength: 200 }
        destination: { type: string }
        description: { type: string, maxLength: 2000 }
        startDate: { type: string, format: date }
        endDate: { type: string, format: date }
        visibility: { type: string, enum: [PRIVATE, PUBLIC, UNLISTED] }
        maxParticipants: { type: integer, minimum: 1, maximum: 20 }

    UpdateTripRequest:
      type: object
      properties:
        title: { type: string, maxLength: 200 }
        destination: { type: string }
        description: { type: string, maxLength: 2000 }
        startDate: { type: string, format: date }
        endDate: { type: string, format: date }
        status: { type: string }
        visibility: { type: string }
        maxParticipants: { type: integer, minimum: 1, maximum: 20 }
        coverImageUrl: { type: string }

    TripResponse:
      type: object
      properties:
        id: { type: string, format: uuid }
        title: { type: string }
        destination: { type: string }
        description: { type: string }
        startDate: { type: string, format: date }
        endDate: { type: string, format: date }
        status:
          type: string
          enum: [DRAFT, PLANNED, ONGOING, COMPLETED, CANCELLED]
          description: >
            DRAFT ⇄ PLANNED is auto-managed from the itinerary (a trip stays DRAFT and
            hidden from other users until 2+ days each have an activity, or one day has
            more than one). ONGOING/COMPLETED/CANCELLED are set deliberately via
            PATCH /trips/{tripId}/status and are never overridden by itinerary edits.
        visibility: { type: string, enum: [PRIVATE, PUBLIC, UNLISTED] }
        maxParticipants: { type: integer }
        coverImageUrl: { type: string }
        createdBy: { type: string, format: uuid }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        currentUserStatus: { type: string }
        memberCount: { type: integer }

    TripDetailResponse:
      type: object
      allOf:
        - $ref: '#/components/schemas/TripResponse'
        - type: object
          properties:
            participants:
              type: array
              items:
                $ref: '#/components/schemas/ParticipantResponse'

    TripPageResponse:
      type: object
      properties:
        trips:
          type: array
          items:
            $ref: '#/components/schemas/TripResponse'
        page: { type: integer }
        size: { type: integer }
        totalElements: { type: integer }
        totalPages: { type: integer }
        hasNext: { type: boolean }

    UpdateItineraryRequest:
      type: object
      required: [dayPlans]
      properties:
        dayPlans:
          type: array
          items:
            type: object
            required: [dayNumber, activities]
            properties:
              dayNumber: { type: integer, minimum: 1 }
              date: { type: string, format: date }
              title: { type: string, maxLength: 200 }
              activities:
                type: array
                items:
                  type: object
                  required: [title, category]
                  properties:
                    title: { type: string, maxLength: 200 }
                    description: { type: string, maxLength: 2000 }
                    location: { type: string, maxLength: 500 }
                    startTime: { type: string, format: time }
                    endTime: { type: string, format: time }
                    category: { type: string, enum: [ACCOMMODATION, TRANSPORT, FOOD, SIGHTSEEING, ACTIVITY, SHOPPING, OTHER] }
                    notes: { type: string, maxLength: 1000 }

    ItineraryResponse:
      type: object
      properties:
        tripId: { type: string, format: uuid }
        dayPlans:
          type: array
          items:
            $ref: '#/components/schemas/DayPlanResponse'
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    DayPlanResponse:
      type: object
      properties:
        dayPlanId: { type: string, format: uuid }
        dayNumber: { type: integer }
        date: { type: string, format: date }
        title: { type: string }
        activities:
          type: array
          items:
            $ref: '#/components/schemas/ActivityResponse'
        votingEnabled: { type: boolean }
        votingFrozen: { type: boolean }
        votingDeadline: { type: string, format: date-time }
        upvotes: { type: integer }
        downvotes: { type: integer }
        currentUserVote: { type: string, enum: [UPVOTE, DOWNVOTE], nullable: true }

    ActivityResponse:
      type: object
      properties:
        activityId: { type: string, format: uuid }
        title: { type: string }
        description: { type: string }
        location: { type: string }
        startTime: { type: string, format: time }
        endTime: { type: string, format: time }
        category: { type: string }
        notes: { type: string }
        orderIndex: { type: integer }
        upvotes: { type: integer }
        downvotes: { type: integer }
        currentUserVote: { type: string, nullable: true }

    ParticipantResponse:
      type: object
      properties:
        id: { type: string, format: uuid }
        userId: { type: string, format: uuid }
        role: { type: string, enum: [OWNER, EDITOR, VIEWER, MEMBER] }
        status: { type: string, enum: [PENDING, PENDING_APPROVAL, ACCEPTED, DECLINED, LEFT, INVITED] }
        joinedAt: { type: string, format: date-time }

    ParticipantActionResponse:
      type: object
      properties:
        message: { type: string }
        participant:
          $ref: '#/components/schemas/ParticipantResponse'

    VoteSummaryResponse:
      type: object
      properties:
        dayPlanId: { type: string, format: uuid }
        dayNumber: { type: integer }
        upvotes: { type: integer }
        downvotes: { type: integer }
        currentUserVote: { type: string, nullable: true }
        votingEnabled: { type: boolean }
        votingFrozen: { type: boolean }
        votingDeadline: { type: string, format: date-time }

    ActivityVoteSummaryResponse:
      type: object
      properties:
        activityId: { type: string, format: uuid }
        upvotes: { type: integer }
        downvotes: { type: integer }
        currentUserVote: { type: string, nullable: true }

    CommentResponse:
      type: object
      properties:
        id: { type: string }
        activityId: { type: string }
        userId: { type: string }
        content: { type: string }
        createdAt: { type: string, format: date-time }
